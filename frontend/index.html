<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Internship Platform - Test</title>
</head>
<body>

<h2>Register</h2>
<input type="email" id="reg-email" placeholder="Email"><br>
<input type="password" id="reg-password" placeholder="Password"><br>
<select id="reg-role">
  <option value="student">Student</option>
  <option value="company">Company</option>
</select><br>
<button onclick="register()">Register</button>
<p id="reg-result"></p>

<hr>

<h2>Login</h2>
<input type="email" id="login-email" placeholder="Email"><br>
<input type="password" id="login-password" placeholder="Password"><br>
<button onclick="login()">Login</button>
<p id="login-result"></p>

<script>
async function register() {
  const email = document.getElementById('reg-email').value;
  const password = document.getElementById('reg-password').value;
  const role = document.getElementById('reg-role').value;

  const res = await fetch('http://127.0.0.1:5000/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, role })
  });
  const data = await res.json();
  document.getElementById('reg-result').innerText = JSON.stringify(data);
}

async function login() {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;

  const res = await fetch('http://127.0.0.1:5000/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password })
  });
  const data = await res.json();
  document.getElementById('login-result').innerText = JSON.stringify(data);
}
</script>

</body>
</html>
